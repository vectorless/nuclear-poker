(9% - 13px); height: 48px;\n\tborder-radius: 24px;\n\tbackground:\n\t\tradial-gradient(circle at 15px 50%, #f6dc9c 0 2px, #5a3c10 3px 4px, transparent 5px),\n\t\tradial-gradient(circle at calc(100% - 15px) 50%, #f6dc9c 0 2px, #5a3c10 3px 4px, transparent 5px),\n\t\tlinear-gradient(180deg, #f0cf7c 0%, #c08a35 38%, #8a5c1e 70%, #5a3c10 100%);\n\tbox-shadow: 0 0 0 2px #2a1d08, inset 0 2px 0 rgba(255, 244, 200, 0.7), inset 0 -3px 6px rgba(40, 24, 4, 0.6), 0 10px 24px rgba(0, 0, 0, 0.65);\n}\n#status::after {\n\tcontent: \"ENRICHING URANIUM \\2622\"; position: absolute; z-index: 3;\n\tleft: 0; right: 0; bottom: calc(9% + 42px); text-align: center;\n\tfont: 700 20px \"Stardos Stencil\", \"Courier New\", monospace; letter-spacing: 5px;\n\tcolor: #e9c977; text-shadow: 0 2px 0 #1a1408, 0 0 12px rgba(242, 177, 52, 0.45);\n\tanimation: np-flicker 2.4s infinite;\n}\n#status-progress {\n\tz-index: 2; height: 22px; bottom: 9%;\n\t-webkit-appearance: none; appearance: none;\n\tborder: 2px solid #2a1d08; border-radius: 11px; overflow: hidden;\n\tbackground: #16150e; box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.85);\n}\n#status-progress::-webkit-progress-bar { background: #16150e; border-radius: 11px; }\n#status-progress::-webkit-progress-value {\n\tborder-radius: 11px;\n\tbackground: repeating-linear-gradient(-45deg, #f2b134 0 12px, #2b241a 12px 24px);\n\tbox-shadow: 0 0 12px #f2b134;\n}\n#status-progress::-moz-progress-bar {\n\tborder-radius: 11px;\n\tbackground: repeating-linear-gradient(-45deg, #f2b134 0 12px, #2b241a 12px 24px);\n}\n#status-notice { font-family: \"Courier New\", monospace; background-color: #3a120c; border: 2px solid #c0392b; color: #ffd9d2; }\n@keyframes np-flicker { 0%, 100% { opacity: 1; } 46% { opacity: 1; } 48% { opacity: 0.55; } 50% { opacity: 1; } 78% { opacity: 0.85; } }\n</style>"
